name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: ci
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      APP: .build/xcode/Build/Products/Release/Kern.app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          project_version="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION = (.+);$/\1/p' App/Kern.xcodeproj/project.pbxproj | sort -u)"

          if [[ "$project_version" != "$version" ]]; then
            echo "::error::MARKETING_VERSION is ${project_version}, but the tag is ${GITHUB_REF_NAME}."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check for signing credentials
        id: signing
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
        run: |
          if [[ -n "$CERTIFICATE" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DEVELOPER_ID_CERTIFICATE is not set, so Kern.app is signed ad hoc, is not notarized, and the Homebrew cask is not updated."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import the signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/certificate.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          base64 --decode <<< "$CERTIFICATE" > "$certificate"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"

      - name: Build Kern.app
        env:
          SIGNED: ${{ steps.signing.outputs.enabled }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          signing=()

          if [[ "$SIGNED" == true ]]; then
            signing=(CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM="$TEAM_ID" OTHER_CODE_SIGN_FLAGS=--timestamp)
          fi

          xcodebuild build \
            -project App/Kern.xcodeproj \
            -scheme Kern \
            -configuration Release \
            -destination platform=macOS,arch=arm64 \
            -derivedDataPath .build/xcode \
            "${signing[@]}"

          codesign --verify --strict --verbose=2 "$APP"

      - name: Notarize Kern.app
        if: steps.signing.outputs.enabled == 'true'
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          submission="$RUNNER_TEMP/Kern.zip"

          printf '%s\n' "$API_KEY" > "$key"
          ditto -c -k --keepParent "$APP" "$submission"

          xcrun notarytool submit "$submission" --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" --wait
          xcrun stapler staple "$APP"
          spctl --assess --type execute --verbose "$APP"

      - name: Package Kern.app
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          archive="Kern-$VERSION.zip"

          ditto -c -k --keepParent "$APP" "$archive"
          shasum -a 256 "$archive" | tee "$archive.sha256"

          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d ' ' -f 1 "$archive.sha256")" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" \
              --title "Kern $VERSION" --generate-notes --verify-tag
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: d3lm/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update the Homebrew cask
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          mkdir -p Casks

          cat > Casks/kern.rb <<EOF
          cask "kern" do
            version "$VERSION"
            sha256 "$SHA256"

            url "https://github.com/d3lm/kern/releases/download/v#{version}/Kern-#{version}.zip"
            name "Kern"
            desc "A lightweight macOS menu-bar monitor for Apple Silicon."
            homepage "https://github.com/d3lm/kern"

            livecheck do
              url :url
              strategy :github_latest
            end

            depends_on arch: :arm64
            depends_on macos: ">= :sequoia"

            app "Kern.app"

            uninstall quit: "dev.kern.Kern"

            zap trash: "~/Library/Preferences/dev.kern.Kern.plist"
          end
          EOF

          git add Casks/kern.rb

          if git diff --cached --quiet; then
            echo "Casks/kern.rb is already at $VERSION."
            exit 0
          fi

          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "kern $VERSION"
          git push
